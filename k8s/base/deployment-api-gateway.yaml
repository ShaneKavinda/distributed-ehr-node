apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: api-gateway-service:local
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: API_HOST
          value: 0.0.0.0
        - name: API_PORT
          value: "8080"
        # P2P connection settings for dynamic discovery
        - name: P2P_SERVICE_NAME
          value: hospital-headless
        - name: P2P_PORT
          value: "7001"
        - name: P2P_TIMEOUT
          value: "5.0"
        # EHR-CRUD connection settings
        - name: GRPC_PORT
          value: "50051"
        - name: GRPC_TIMEOUT
          value: "5.0"
        # Number of replicas in the StatefulSet
        - name: HOSPITAL_REPLICAS
          value: "3"
        - name: STATEFULSET_NAME
          value: hospital
        - name: AUTH_DB_REQUIRED
          value: "true"
        - name: AUTH_DB_INIT_MAX_ATTEMPTS
          value: "60"
        - name: AUTH_DB_INIT_RETRY_DELAY_SECONDS
          value: "2"
        - name: MYSQL_PRIMARY_HOST
          value: mysql-primary
        - name: MYSQL_PRIMARY_PORT
          value: "3306"
        - name: MYSQL_AUTH_DATABASE
          value: auth_db
        - name: MYSQL_AUTH_USER
          value: auth_user
        - name: MYSQL_AUTH_PASSWORD
          value: auth_password
        - name: MYSQL_REPLICA_HOSTS
          value: mysql-replica-1,mysql-replica-2,mysql-replica-3
        - name: MYSQL_REPL_USER
          value: repl_user
        - name: MYSQL_REPL_PASSWORD
          value: repl_password
        - name: MYSQL_REPL_STREAM_SERVER_ID
          value: "101"
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        startupProbe:
          httpGet:
            path: /
            port: 8080
          failureThreshold: 60
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
      - name: auth-mysql-replicator
        image: api-gateway-service:local
        imagePullPolicy: IfNotPresent
        command: ["python","-m","auth.mysql_replication_worker"]
        env:
        - name: MYSQL_PRIMARY_HOST
          value: mysql-primary
        - name: MYSQL_PRIMARY_PORT
          value: "3306"
        - name: MYSQL_AUTH_DATABASE
          value: auth_db
        - name: MYSQL_AUTH_USER
          value: auth_user
        - name: MYSQL_AUTH_PASSWORD
          value: auth_password
        - name: MYSQL_REPLICA_HOSTS
          value: mysql-replica-1,mysql-replica-2,mysql-replica-3
        - name: MYSQL_REPL_USER
          value: repl_user
        - name: MYSQL_REPL_PASSWORD
          value: repl_password
        - name: MYSQL_REPL_STREAM_SERVER_ID
          value: "101"
