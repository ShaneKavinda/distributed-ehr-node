apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: api-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api-gateway
        image: api-gateway-service:local
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: API_HOST
          value: 0.0.0.0
        - name: API_PORT
          value: "8080"
        # P2P connection settings for dynamic discovery
        - name: P2P_SERVICE_NAME
          value: hospital-headless
        - name: P2P_PORT
          value: "7001"
        - name: P2P_TIMEOUT
          value: "5.0"
        # EHR-CRUD connection settings
        - name: GRPC_PORT
          value: "50051"
        - name: GRPC_TIMEOUT
          value: "5.0"
        # Number of replicas in the StatefulSet
        - name: HOSPITAL_REPLICAS
          value: "3"
        - name: STATEFULSET_NAME
          value: hospital
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
