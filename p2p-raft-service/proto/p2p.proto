syntax = "proto3";

package p2p;

import "google/protobuf/struct.proto";

// =========================================================
// APPLICATION -> P2P (COMMAND SUBMISSION)
// =========================================================
service CommandService {
  // Submit a command to the Raft cluster.
  // Only the leader will accept.
  rpc SubmitCommand(CommandRequest) returns (CommandResponse);
}

message CommandRequest {
  string command_id = 1;          // UUID for idempotency
  string command_type = 2;        // e.g. PATIENT_CREATE
  google.protobuf.Struct payload = 3;
}

message CommandResponse {
  bool accepted = 1;              // false if not leader
  string leader_id = 2;           // hint for redirect
  string leader_address = 3;      // host:port of leader for redirect
  bool committed = 4;             // true if committed on leader
  uint64 commit_index = 5;        // log index if committed
}

// =========================================================
// RAFT NODE <-> NODE (INTERNAL ONLY)
// =========================================================
service RaftService {
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
}

// ---------- AppendEntries ----------
message AppendEntriesRequest {
  string leader_id = 1;
  uint64 term = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
}

// ---------- RequestVote ----------
message RequestVoteRequest {
  string candidate_id = 1;
  uint64 term = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

// ---------- Snapshot ----------
message InstallSnapshotRequest {
  string leader_id = 1;
  uint64 term = 2;
  uint64 last_included_index = 3;
  uint64 last_included_term = 4;
  bytes snapshot = 5;
}

message InstallSnapshotResponse {
  uint64 term = 1;
}

// =========================================================
// SHARED STRUCTURES
// =========================================================
message LogEntry {
  uint64 index = 1;
  uint64 term = 2;
  string command_id = 3;
  string command_type = 4;
  google.protobuf.Struct payload = 5;
}
